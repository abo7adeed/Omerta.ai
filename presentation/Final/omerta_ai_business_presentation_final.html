<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Omerta.ai — Business Presentation</title>
    <style>
        :root {
            --w: #fff;
            --lb: #F1F7FF;
            --n: #17324D;
            --b: #3478F6;
            --t: #14B8A6;
            --p: #8B7CF6;
            --c: #FF7B72;
            --y: #FFD166;
            --bd: #E4EAF2;
            --g: #65758B;
            --ui-h: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #fff;
            font-family: Manrope, Inter, system-ui, sans-serif;
            color: var(--n);
            touch-action: manipulation;
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: 0
        }

        #stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1920px;
            height: 1080px;
            transform-origin: center center;
            z-index: 1;
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .s {
            position: absolute;
            inset: 0;
            padding: 44px 100px 56px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: translateX(70px);
            transition: opacity .55s, transform .55s, visibility .55s;
            background: radial-gradient(circle at 85% 10%, #F1F7FFcc, transparent 55%)
        }

        .s.on {
            opacity: 1;
            visibility: visible;
            transform: none
        }

        .s.pv {
            transform: translateX(-70px)
        }

        h1 {
            font-size: 68px;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -.02em;
            max-width: 1720px
        }

        h1 em {
            font-style: normal;
            color: var(--b)
        }

        .sub {
            font-size: 36px;
            color: var(--g);
            margin-top: 12px
        }

        .vis {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            position: relative
        }

        .tk {
            font-size: 34px;
            font-weight: 700;
            color: var(--n);
            background: var(--lb);
            border: 1px solid var(--bd);
            border-left: 8px solid var(--b);
            border-radius: 14px;
            padding: 14px 30px;
            align-self: flex-start
        }

        .rv {
            opacity: 0
        }

        .s.on .rv {
            animation: up .6s both;
            animation-delay: calc(var(--i, 0)*.13s + .25s)
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(22px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        svg.net {
            width: 100%;
            height: 100%
        }

        .net text {
            font: 700 20px Manrope, sans-serif;
            fill: var(--n);
            text-anchor: middle;
            dominant-baseline: central
        }

        .chip {
            background: #fff;
            border: 2px solid var(--c);
            border-radius: 40px;
            padding: 14px 30px;
            font-size: 30px;
            font-weight: 700;
            box-shadow: 0 6px 18px #17324d14
        }

        .flow {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: nowrap
        }

        .step {
            flex: 1;
            background: #fff;
            border: 1px solid var(--bd);
            border-top: 8px solid var(--c);
            border-radius: 20px;
            padding: 24px 10px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            box-shadow: 0 10px 30px #17324d14;
            min-height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px
        }

        .step b {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--c);
            color: #fff;
            margin: 0 auto;
            display: grid;
            place-items: center;
            font-size: 26px
        }

        .ar {
            font-size: 40px;
            color: var(--g)
        }

        .grid {
            display: grid;
            gap: 28px;
            width: 100%
        }

        .g3 {
            grid-template-columns: repeat(3, 1fr)
        }

        .g4 {
            grid-template-columns: repeat(4, 1fr)
        }

        .card {
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 10px 30px #17324d14;
            font-size: 30px;
            line-height: 1.3;
            border-top: 8px solid var(--c)
        }

        .card b {
            display: block;
            font-size: 40px;
            margin-bottom: 8px;
            line-height: 1.15
        }

        .card i {
            font-style: normal;
            font-size: 52px;
            display: block;
            margin-bottom: 6px
        }

        .card small {
            color: var(--g);
            font-size: 29px;
            display: block;
            line-height: 1.3
        }

        .hero {
            align-items: center;
            justify-content: center;
            text-align: center
        }

        .hero .net {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%
        }

        .hero .tx {
            position: relative;
            z-index: 2;
            background: #ffffffdd;
            border-radius: 30px;
            padding: 30px 60px
        }

        .hero h1 {
            font-size: 66px;
            max-width: 1250px;
            text-wrap: balance
        }

        #stage>.s:last-child .tx h1 {
            max-width: 950px
        }

        .hero .sub {
            font-size: 40px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto
        }

        .hero .cta {
            display: inline-block;
            margin-top: 30px;
            background: var(--b);
            color: #fff;
            font-size: 36px;
            font-weight: 800;
            border-radius: 60px;
            padding: 20px 50px
        }

        .cmp {
            display: grid;
            grid-template-columns: 1fr 70px 1fr;
            gap: 18px 14px;
            width: 100%;
            align-items: center;
            font-size: 34px;
            font-weight: 700
        }

        .cmp div {
            padding: 20px 28px;
            border-radius: 16px
        }

        .old {
            background: var(--lb);
            color: var(--g);
            border: 1px solid var(--bd)
        }

        .new {
            background: var(--t);
            color: #fff
        }

        .cmp .m {
            text-align: center;
            color: var(--g);
            padding: 0;
            font-size: 44px
        }

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 26px;
            height: 380px;
            border-bottom: 3px solid var(--bd);
            padding: 0 20px
        }

        .bar {
            width: 120px;
            border-radius: 14px 14px 0 0;
            background: var(--c);
            transform-origin: bottom;
            text-align: center;
            font-weight: 800;
            font-size: 26px;
            padding-top: 8px;
            color: #fff
        }

        .s.on .bar {
            animation: grow .9s both .4s
        }

        @keyframes grow {
            from {
                transform: scaleY(0)
            }

            to {
                transform: none
            }
        }

        .lbls {
            display: flex;
            gap: 26px;
            padding: 10px 20px;
            font-size: 27px;
            font-weight: 700;
            color: var(--g)
        }

        .lbls span {
            width: 120px;
            text-align: center
        }

        .tag {
            display: inline-block;
            background: var(--y);
            color: var(--n);
            font-weight: 800;
            font-size: 26px;
            border-radius: 30px;
            padding: 8px 22px
        }

        .kpi {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            font-size: 30px;
            padding: 14px 0;
            border-bottom: 1px solid var(--bd)
        }

        .kpi span {
            color: var(--g);
            white-space: nowrap;
            font-size: 24px
        }

        .case {
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 26px;
            box-shadow: 0 14px 40px #17324d1c;
            padding: 36px 44px;
            width: 1050px;
            font-size: 36px
        }

        .case div {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--bd)
        }

        .case span {
            color: var(--g)
        }

        .lc {
            display: flex;
            gap: 14px;
            margin-bottom: 34px
        }

        .lc div {
            flex: 1;
            text-align: center;
            border-radius: 40px;
            padding: 18px 8px;
            background: var(--lb);
            color: var(--g);
            font-weight: 800;
            font-size: 32px;
            border: none
        }

        .s.on .lc div {
            animation: hl .5s forwards;
            animation-delay: calc(var(--i)*1.2s + .6s)
        }

        @keyframes hl {
            to {
                background: var(--b);
                color: #fff
            }
        }

        .join {
            border: 3px dashed var(--b);
            border-radius: 30px;
            padding: 36px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 1500px;
            position: relative
        }

        .join .chip {
            animation: j 1.1s both;
            animation-delay: 1.3s
        }

        .join::before {
            content: "One investigation view";
            position: absolute;
            top: -20px;
            left: 40px;
            background: #fff;
            padding: 0 14px;
            font-weight: 800;
            font-size: 34px;
            color: var(--b)
        }

        @keyframes j {
            from {
                transform: translate(var(--x), var(--y));
                opacity: .7
            }

            to {
                transform: none;
                opacity: 1
            }
        }

        .hd {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 16px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--n);
            background: #fff;
            border: 2px solid var(--bd);
            border-radius: 50px;
            padding: 8px 30px 8px 10px;
            margin-bottom: 18px;
            box-shadow: 0 6px 18px #17324d14
        }

        .hd b {
            background: var(--hc, var(--b));
            color: #fff;
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 26px;
            letter-spacing: .04em
        }

        .hero .hd {
            position: absolute;
            left: 100px;
            top: 44px;
            z-index: 3;
            margin: 0
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 34px;
            margin-bottom: 14px
        }

        .logo svg {
            width: 160px;
            height: 160px;
            flex: none
        }

        .logo span {
            font-size: 200px;
            font-weight: 800;
            letter-spacing: -.03em;
            line-height: 1;
            color: var(--n)
        }

        .logo span em {
            font-style: normal;
            color: var(--b);
            font-size: .5em;
            letter-spacing: 0;
            margin-left: 6px
        }

        .logo.sm {
            gap: 22px;
            margin-bottom: 6px
        }

        .logo.sm svg {
            width: 84px;
            height: 84px
        }

        .logo.sm span {
            font-size: 100px
        }

        .stmt {
            --c: #FF7B72;
            font-size: 40px;
            line-height: 1.35;
            font-weight: 600;
            background: var(--lb);
            border: 1px solid var(--bd);
            border-left: 12px solid var(--c);
            border-radius: 22px;
            padding: 30px 44px
        }

        .stmt b {
            color: var(--c)
        }

        .ag {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%
        }

        .agc {
            flex: 1;
            background: #fff;
            border: 1px solid var(--bd);
            border-top: 8px solid var(--c);
            border-radius: 20px;
            padding: 22px 14px;
            text-align: center;
            box-shadow: 0 10px 30px #17324d14
        }

        .agc.big {
            flex: 1.15
        }

        .agc i {
            font-style: normal;
            font-size: 52px;
            display: block;
            margin-bottom: 6px
        }

        .agc b {
            display: block;
            font-size: 32px;
            margin-bottom: 8px;
            line-height: 1.15
        }

        .agc small {
            font-size: 24px;
            color: var(--g);
            display: block;
            line-height: 1.3
        }

        .agstack {
            flex: 1.75;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .aga {
            background: #fff;
            border: 1px solid var(--bd);
            border-left: 8px solid var(--c);
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 27px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 22px #17324d14;
            line-height: 1.2
        }

        .aga i {
            font-style: normal;
            font-size: 36px
        }

        .loop {
            margin-top: 30px;
            font-size: 30px;
            font-weight: 700;
            color: var(--n);
            background: #fff;
            border: 3px dashed var(--b);
            border-radius: 50px;
            padding: 14px 36px
        }

        #ui {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--ui-h, 64px);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 22px;
            z-index: 5;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--bd);
            font-weight: 700;
            box-shadow: 0 -4px 20px rgba(23, 50, 77, 0.05);
        }

        #ui button {
            border: 1px solid var(--bd);
            background: #fff;
            color: var(--n);
            font: 700 16px Manrope, sans-serif;
            border-radius: 10px;
            padding: 9px 16px;
            cursor: pointer;
            touch-action: manipulation;
            transition: background .2s, border-color .2s;
        }

        #ui button:hover {
            background: var(--lb);
            border-color: var(--b);
        }

        #ui button:focus-visible {
            outline: 3px solid var(--b);
        }

        #cnt {
            margin-left: auto;
            font-size: 18px;
            white-space: nowrap;
        }

        #pb {
            position: fixed;
            top: 0;
            left: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--b), var(--t), var(--p));
            z-index: 6;
            transition: width .5s;
        }

        #notes {
            position: fixed;
            right: 0;
            top: 0;
            bottom: var(--ui-h, 64px);
            width: min(440px, 92vw);
            background: #fff;
            border-left: 1px solid var(--bd);
            box-shadow: -10px 0 30px #17324d1a;
            padding: 28px;
            overflow: auto;
            z-index: 4;
            transform: translateX(105%);
            transition: transform .35s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 17px;
            line-height: 1.6;
            -webkit-overflow-scrolling: touch;
        }

        #notes.open {
            transform: none;
        }

        #rotate-hint {
            display: none;
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(23, 50, 77, 0.94);
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            z-index: 10;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: .02em;
        }

        @media (max-width: 900px) and (orientation: portrait) {
            #rotate-hint {
                display: block;
            }
        }

        @media (max-width: 768px) {
            :root {
                --ui-h: 52px;
            }

            #ui {
                padding: 0 12px;
                gap: 8px;
            }

            #ui button {
                padding: 6px 12px;
                font-size: 13px;
                border-radius: 8px;
            }

            #cnt {
                font-size: 14px;
            }

            #notes {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            #ui button#fs {
                display: none;
            }

            #ui {
                padding: 0 8px;
                gap: 6px;
            }

            #ui button {
                padding: 6px 9px;
                font-size: 12px;
            }
        }

        #notes h3 {
            color: var(--b);
            margin-bottom: 12px
        }

        .det {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .hero .det {
            justify-content: center
        }

        .det span {
            font-size: 25px;
            font-weight: 700;
            color: var(--g);
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 30px;
            padding: 8px 20px 8px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px
        }

        .det span::before {
            content: "";
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--k, #3478F6)
        }

        #glow {
            position: fixed;
            width: 360px;
            height: 360px;
            margin: -180px 0 0 -180px;
            border-radius: 50%;
            background: radial-gradient(circle, #3478F622, #14B8A614 45%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            left: -999px;
            top: -999px
        }

        .vis {
            translate: calc(var(--mx, 0)*-12px) calc(var(--my, 0)*-8px)
        }

        .s h1 {
            translate: calc(var(--mx, 0)*6px) calc(var(--my, 0)*4px)
        }

        .hero .net {
            translate: calc(var(--mx, 0)*-26px) calc(var(--my, 0)*-16px)
        }

        .card,
        .step,
        .chip,
        .case,
        .agc,
        .aga,
        .cmp div:not(.m) {
            translate: calc(var(--tx, 0)*1px) calc(var(--ty, 0)*1px);
            scale: 1;
            transition: scale .25s, translate .2s, box-shadow .25s
        }

        .card:hover,
        .step:hover,
        .chip:hover,
        .case:hover,
        .agc:hover,
        .aga:hover,
        .cmp div:not(.m):hover {
            scale: 1.05;
            box-shadow: 0 18px 40px #17324d2e
        }

        .net g:has(rect) {
            cursor: pointer;
            transform-box: fill-box;
            transform-origin: center;
            transition: scale .25s
        }

        .net g:has(rect):hover {
            scale: 1.18
        }

        .arch-diag {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .arch-diag text {
            font-family: Manrope, Inter, system-ui, sans-serif;
            user-select: none;
        }

        .arch-diag g:has(rect) {
            cursor: pointer;
            transform-box: fill-box;
            transform-origin: center;
            transition: transform .25s ease, filter .25s ease;
        }

        .arch-diag g:has(rect):hover {
            transform: translateY(-2px);
            filter: drop-shadow(0 10px 22px rgba(23, 50, 77, 0.14));
        }

        .bar {
            transition: filter .2s, scale .2s
        }

        .bar:hover {
            filter: brightness(1.1);
            scale: 1.08 1.03
        }

        .rip {
            position: fixed;
            width: 20px;
            height: 20px;
            margin: -10px;
            border-radius: 50%;
            border: 3px solid var(--b);
            pointer-events: none;
            z-index: 7;
            animation: rp .8s forwards
        }

        @keyframes rp {
            to {
                transform: scale(9);
                opacity: 0
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }

            .rv {
                opacity: 1
            }
        }
    </style>
</head>

<body>
    <canvas id="bg"></canvas>
    <div id="glow"></div>
    <div id="pb"></div>
    <div id="rotate-hint">🔄 Rotate device to landscape for optimal presentation</div>
    <div id="stage"></div>
    <aside id="notes" aria-label="Speaker notes">
        <h3>Speaker notes</h3>
        <div id="nt"></div>
    </aside>
    <div id="ui"><button id="pv">← Previous</button><button id="nx">Next →</button><button id="fs">Fullscreen
            (F)</button><button id="nb">Notes (N)</button><span id="cnt">01 / 22</span></div>
    <script>
        const C = { b: '#3478F6', t: '#14B8A6', p: '#8B7CF6', c: '#FF7B72', y: '#FFD166' }, R = (a, b) => a + Math.random() * (b - a);
        // network builder: nodes [id,x,y,label,color,big], edges [a,b,color,dur,delay]
        function net(N, E, vb = '-150 0 1300 500', fs = 26) {
            const m = {}; N.forEach(n => m[n[0]] = n); let s = `<svg class="net" viewBox="${vb}">`;
            E.forEach(([a, b, col, d = 3, dl = 0], i) => {
                const A = m[a], B = m[b], p = `M${A[1]} ${A[2]}L${B[1]} ${B[2]}`;
                s += `<g class="rv" style="--i:${dl}"><path d="${p}" stroke="${col}" stroke-width="3" stroke-dasharray="8 8" opacity=".45" fill="none"/>` + [0, 1].map(k => `<circle r="7" fill="${col}"><animateMotion dur="${d}s" begin="${k * d / 2}s" repeatCount="indefinite" path="${p}"/></circle>`).join('') + '</g>'
            });
            N.forEach(([id, x, y, l, col, big], i) => { const k = big ? 1.15 : 1, w = l.length * fs * .58 * k + fs * 1.7, h = fs * (big ? 3.2 : 2.3); s += `<g class="rv" style="--i:${i * .4}"><rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${big ? col : '#fff'}" stroke="${col}" stroke-width="3"/><text x="${x}" y="${y}" style="font-size:${fs * k}px${big ? ';fill:#fff' : ''}">${l}</text></g>` }); return s + '</svg>'
        }
        const chip = (t, c, i) => `<div class="chip rv" style="--c:${c};--i:${i}">${t}</div>`;
